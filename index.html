<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>清明キャリアApps（プレリリース版）</title>
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' data: blob:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
[hidden]{display:none!important}
:root{
  color-scheme:light;
  --bg:#E8F4F8; --card:#FFFFFF; --tx:#1A3040; --mute:#4F6878; --line:#BFD8E3;
  --ac:#2E7D9A; --acsoft:#C8E0EB; --acdeep:#1C5F78;
  --p1:#2E7D9A; --p1s:#D3E8F0;   /* 自分を知る */
  --p2:#3C7F55; --p2s:#D7EBDD;   /* 人と関わる */
  --p3:#A8621C; --p3s:#F3E2CC;   /* ポジションをとる */
  --p1d:#1C5F78; --p2d:#285C38; --p3d:#6B4210; --fs:17px;
  --warn:#F6E6CF; --warnx:#6B4210; --good:#DCEEDF; --goodx:#285C38;
  --r:16px; --nav:64px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"BIZ UDPGothic","Hiragino Sans","Meiryo",sans-serif;font-size:var(--fs);line-height:1.7;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--acdeep);outline-offset:2px}
a{color:var(--acdeep)}
.app{display:flex;flex-direction:column;height:100%}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.prebar{padding:6px 16px;font-size:14px;color:var(--acdeep);background:var(--acsoft);border-bottom:1px solid var(--line)}
.top .name{font-weight:700;font-size:16px;letter-spacing:.04em}
.top .me{margin-left:auto;font-size:14px;color:var(--mute)}
.top .me button{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:2px 12px;font-size:14px}
main{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.pane{max-width:560px;margin:0 auto;padding:20px 16px 32px;display:flex;flex-direction:column;gap:14px;min-height:100%}
.nav{display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{background:none;border:0;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;color:var(--mute);min-height:var(--nav)}
.nav button svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--acdeep);font-weight:700}
.nav button[aria-current="page"] svg{stroke-width:2.4}
.nav .helpbtn{color:var(--warnx)}
/* 進み具合 */
.steps{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--mute);min-height:28px}
.steps .back{background:none;border:0;padding:4px 0;color:var(--acdeep);font-size:15px}
.dots{display:flex;gap:6px;margin-left:auto}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ac)}
h1.q{font-size:23px;line-height:1.45;margin:4px 0 2px;text-wrap:balance}
.hint{margin:0;color:var(--mute);font-size:15px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:14px 16px;font-size:17px;line-height:1.5;transition:border-color .15s,background .15s,transform .1s}
.opt:hover{border-color:var(--ac)}
.opt:active{transform:scale(.99)}
.opt[aria-pressed="true"]{border-color:var(--ac);background:var(--acsoft)}
.opt .num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--acsoft);color:var(--acdeep);display:grid;place-items:center;font-weight:700;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:10px 18px;font-size:17px}
.chip:hover{border-color:var(--ac)}
.primary{display:block;width:100%;background:var(--acsoft);border:2px solid var(--ac);color:var(--acdeep);font-weight:700;font-size:18px;border-radius:var(--r);padding:14px;text-align:center;text-decoration:none}
.primary:disabled{opacity:.45;cursor:default}
.secondary{display:block;width:100%;background:none;border:0;color:var(--acdeep);font-size:16px;padding:8px;text-align:center;text-decoration:underline;text-underline-offset:3px}
.spacer{flex:1}
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:14px 16px}
.pick{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%}
.pick:hover{border-color:var(--ac)}
.pick .ic{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center}
.pick .ic svg{width:26px;height:26px;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.pick .t{font-weight:700;font-size:17px;line-height:1.45}
.pick .d{font-size:15px;color:var(--mute);line-height:1.55;margin-top:2px}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:13px;color:var(--mute);margin-top:6px;align-items:center}
.tag{border-radius:6px;padding:1px 8px;font-size:13px;font-weight:700}
.t-p1{background:var(--p1s);color:var(--p1d)}.t-p2{background:var(--p2s);color:var(--p2d)}.t-p3{background:var(--p3s);color:var(--p3d)}
.notice{background:var(--warn);color:var(--warnx);border-radius:12px;padding:10px 14px;font-size:15px;line-height:1.6}
.notice b{display:block}
.prev{background:var(--card);border:2px solid var(--line);border-left:8px solid var(--ac);border-radius:12px;padding:12px 14px;font-size:15px}
.prev .lbl{color:var(--mute);font-size:13px}
.prev .txt{font-weight:700;font-size:17px;margin:2px 0 8px}
.prev .row{display:flex;gap:8px}
.mini{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px 14px;font-size:14px}
.mini[aria-pressed="true"]{background:var(--good);border-color:#6BA67E;color:var(--goodx)}
.faces{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.face{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center;font-size:16px;line-height:1.4;display:flex;flex-direction:column;align-items:center;gap:6px}
.face svg{width:34px;height:34px;stroke:var(--ac);fill:none;stroke-width:1.8;stroke-linecap:round}
.face[aria-pressed="true"]{border-color:var(--ac);background:var(--acsoft)}
label.fl{font-weight:700;font-size:18px}
textarea,input[type=text]{width:100%;font:inherit;font-size:17px;border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card);color:var(--tx)}
textarea{min-height:110px;resize:vertical}
.linkbtn{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--card);border:2px solid var(--ac);border-radius:var(--r);padding:14px;font-weight:700;color:var(--acdeep);text-decoration:none;font-size:17px}
.linkbtn svg{width:24px;height:24px;stroke:var(--ac);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.box{font-size:14px;color:var(--mute);background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:8px 12px}
.done-hero{text-align:center;padding:10px 0}
.done-hero .big{font-size:22px;font-weight:700}
.stamp{width:88px;height:88px;border-radius:50%;margin:8px auto;display:grid;place-items:center;border:3px solid var(--ac);background:var(--acsoft);animation:pop .5s ease-out}
.stamp svg{width:46px;height:46px;stroke:var(--acdeep);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.term{background:none;border:0;padding:0;border-bottom:2px dotted var(--ac);font:inherit;color:inherit;line-height:1.2}
.pop{position:fixed;left:16px;right:16px;bottom:calc(var(--nav) + 16px);max-width:520px;margin:0 auto;background:var(--card);color:var(--tx);border:2px solid var(--ac);border-radius:14px;padding:12px 16px;z-index:40;font-size:16px;box-shadow:0 8px 24px rgba(26,48,64,.25)}
.pop small{display:block;opacity:.8}
/* こまったとき */
.scrim{position:fixed;inset:0;background:rgba(26,48,64,.35);z-index:30}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--card);border-radius:22px 22px 0 0;max-height:86%;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgba(26,48,64,.2)}
.sheet .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.sheet h2{margin:0;font-size:21px}
.phone{font-size:18px;font-weight:700;user-select:all;-webkit-user-select:all}
.soudan{display:flex;flex-direction:column;gap:2px;padding:10px 0;border-bottom:1px solid var(--line)}
.soudan b{font-size:17px}
.soudan span{font-size:15px;color:var(--mute)}
/* きろく */
h2.sec{font-size:19px;margin:10px 0 0}
.feet{display:flex;flex-direction:column;gap:10px}
.feet .pl{font-weight:700;font-size:15px;margin-bottom:4px}
.feet .it{display:grid;grid-template-columns:1fr auto;gap:8px;font-size:15px;padding:3px 0;border-bottom:1px dotted var(--line)}
.fp{display:flex;gap:3px;align-items:center}
.fp i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.rec{display:flex;flex-direction:column;gap:2px;padding:12px 0;border-bottom:1px solid var(--line)}
.rec .h{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mute)}
.rec .ti{font-weight:700}
.rec .nx{font-size:15px}
.cardimg{width:100%;border-radius:12px;border:2px solid var(--line);-webkit-touch-callout:default}
.set{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:15px}
.ok{background:var(--good);color:var(--goodx);border-radius:10px;padding:8px 12px;font-size:15px}
.ng{background:var(--warn);color:var(--warnx);border-radius:10px;padding:8px 12px;font-size:15px}
/* マップ */
.mapwrap{position:relative;height:100%;overflow:hidden;touch-action:none;background:var(--bg)}
.mapwrap svg{width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}
.mapbar{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;pointer-events:none}
.mapbar>*{pointer-events:auto}
.mapbar .fchip{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-size:14px}
.mapbar .fchip[aria-pressed="true"]{border-color:var(--acdeep);background:var(--acsoft);font-weight:700}
.zoom{position:absolute;right:10px;bottom:12px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:44px;height:44px;border-radius:12px;background:var(--card);border:2px solid var(--line);font-size:20px;font-weight:700;color:var(--acdeep)}
.panel{position:absolute;left:10px;right:64px;bottom:10px;max-width:520px;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px;max-height:58%;overflow:auto;box-shadow:0 8px 24px rgba(26,48,64,.15)}
.panel h3{margin:0;font-size:19px;line-height:1.4}
.panel .close{position:absolute;right:8px;top:6px;background:none;border:0;font-size:22px;color:var(--mute);width:40px;height:40px}
.panel .lst{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.panel .lst button{display:flex;gap:8px;align-items:center;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:15px}
.panel .lst button i{flex:none;width:10px;height:10px;border-radius:50%}
.panel .rel{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.panel .rel button{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:3px 12px;font-size:14px}
/* マップ v7（問いの木） */
.link{stroke:#A9C8D3;stroke-width:2;fill:none;transition:stroke .2s}
.link.hl{stroke:var(--acdeep);stroke-width:3}
.node{cursor:pointer;transition:opacity .2s}
.node:focus{outline:none}.node:focus-visible .box{stroke-width:4}
.node.fade{opacity:.3}
.n-big .box{fill:var(--acsoft);stroke:var(--ac);stroke-width:2.5}
.n-sub .box{fill:#fff;stroke:var(--ac);stroke-width:2}
.n-big.open .box,.n-sub.open .box{stroke:var(--acdeep);stroke-width:3.5}
.n-sub.open .box{fill:#F2F9FC}
.badge{fill:#fff;stroke:var(--acdeep);stroke-width:2.5}
.n-big .badge{fill:#fff}
.bn{font-size:16px;font-weight:700;fill:var(--acdeep)}
.qlbl{fill:var(--tx);font-weight:700}
.n-big .qlbl{font-size:18px}.n-sub .qlbl{font-size:16px}
.chev{fill:none;stroke:var(--acdeep);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.dcnt{font-size:13px;font-weight:700;fill:var(--goodx)}
.n-con .box{stroke-width:2}
.n-con .clbl{font-size:15px;fill:var(--tx)}
.node.sel .box{stroke-width:4}
.node.hl .box{stroke:var(--acdeep)}
.herepill rect{fill:#fff;stroke:var(--acdeep);stroke-width:2.5}
.herepill text{font-size:13px;font-weight:700;fill:var(--acdeep)}
.maptitle{font-weight:700;color:var(--acdeep);background:rgba(255,255,255,.9);border-radius:999px;padding:4px 12px;font-size:15px}
.mapbar .fchip{display:inline-flex;align-items:center;gap:6px}
.mapbar .fchip i,.lg-p i{display:inline-block;width:12px;height:12px;border-radius:3px}
.maplegend{position:absolute;left:10px;bottom:10px;background:rgba(255,255,255,.95);border:2px solid var(--line);border-radius:14px;padding:8px 12px;font-size:13px;line-height:1.6;color:var(--tx);max-width:min(330px,calc(100% - 80px));display:flex;flex-direction:column;gap:2px}
.maplegend b{font-size:14px;color:var(--acdeep)}
.maplegend .hint{font-size:12px;margin:0}
@media (max-width:719px){.maplegend .lg-p,.maplegend .hint,.maplegend b{display:none}.maplegend{flex-direction:row;flex-wrap:wrap;gap:2px 10px;font-size:12px;padding:5px 10px}.mapbar{gap:6px}.mapbar .fchip{padding:2px 9px;font-size:13px}.maptitle{font-size:14px;width:100%;text-align:center}}
.lg-n,.lg-d{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 5px;border-radius:999px;border:2px solid var(--acdeep);font-weight:700;color:var(--acdeep);font-size:12px;margin-right:6px;vertical-align:middle}
.lg-d{border-color:var(--goodx);color:var(--goodx)}
.lg-p{display:flex;flex-wrap:wrap;gap:4px 10px}.lg-p span{display:inline-flex;align-items:center;gap:4px}
.relbox{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.relbox .lbl{font-size:13px;color:var(--mute);width:100%}
/* 次の3つ */
.morebtn{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;column-gap:10px;align-items:center;width:100%;text-align:left;background:#F2F9FC;border:2.5px dashed var(--ac);border-radius:var(--r);padding:12px 16px;color:var(--acdeep);cursor:pointer;transition:background .15s,transform .1s}
.morebtn:hover{background:var(--acsoft);border-style:solid}
.morebtn:active{transform:scale(.99)}
.morebtn .mb-t{font-size:18px;font-weight:700}
.morebtn .mb-s{grid-row:2;font-size:14px;color:var(--mute)}
.morebtn .mb-p{grid-row:2;grid-column:2;display:flex;gap:5px;justify-self:end}
.morebtn .mb-p i{width:8px;height:8px;border-radius:50%;background:#C5DCE5}.morebtn .mb-p i.on{background:var(--acdeep)}
.morebtn svg{grid-row:1;grid-column:2;justify-self:end;width:28px;height:28px;fill:none;stroke:var(--acdeep);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;background:#fff;border:2px solid var(--ac);border-radius:50%;padding:3px}

/* v6.1 追加 */
.primary.alt{background:var(--card);display:flex;align-items:center;justify-content:center;gap:8px}
.primary svg,.linkbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.primary.big{display:flex;align-items:center;justify-content:center;gap:8px;font-size:19px;padding:16px}
.linkrow{display:flex;gap:4px;justify-content:center}
.linkrow .secondary{width:auto;font-size:15px}
.nextbox{background:var(--card);border:2px solid var(--ac);border-radius:var(--r);padding:12px 16px}
.nextbox .lbl{font-size:13px;color:var(--mute)}
.nextbox .txt{font-size:19px;font-weight:700;line-height:1.5}
.ws{margin:0;background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:10px;display:flex;justify-content:center}
.wsimg{width:100%;max-width:360px;height:auto;display:block;border-radius:8px}
.roiro{background:#FFF7EA;border:2px solid #E5B96E;border-radius:var(--r);padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.roiro-h{display:flex;align-items:center;gap:8px;font-weight:700;color:#6B4210}
.roiro-h svg{width:26px;height:26px;stroke:#A8621C;fill:#F6DDB0;stroke-width:1.8;stroke-linejoin:round}
.crumb{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;font-size:15px}
.crumb span{background:#fff;border:1px solid #E5CFA5;border-radius:6px;padding:1px 8px}
.crumb i{font-style:normal;color:#A8621C}
.crumb b{background:#F5DDB5;color:#5A360C;border:2px solid #A8621C;border-radius:6px;padding:2px 10px;font-size:16px}
.mini-steps{margin:0;padding-left:1.4em;font-size:15px;color:#6B4210}
.cardhero{background:var(--card);border:2px solid var(--ac);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:14px}
.flow3{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:center;text-align:center;gap:4px}
.flow3 div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:14px;line-height:1.35;color:var(--acdeep);font-weight:700}
.flow3 svg{width:40px;height:40px;padding:8px;border-radius:14px;background:var(--acsoft);stroke:var(--acdeep);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.flow3 i{font-style:normal;color:var(--ac);font-size:22px}
.restore{display:flex;align-items:center;gap:8px;justify-content:center;font-size:14px;color:var(--acdeep);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.restore svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
details.card summary{cursor:pointer;font-weight:700;font-size:15px}
.sublbl{font-weight:700;font-size:15px;display:block;margin-bottom:4px}
.howto3{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;counter-reset:h}
.howto3 li{display:flex;align-items:center;gap:10px;font-size:15px;counter-increment:h}
.howto3 li::before{content:counter(h);flex:none;width:26px;height:26px;border-radius:50%;background:var(--acsoft);color:var(--acdeep);display:grid;place-items:center;font-weight:700;font-size:14px}
.howto3 svg{flex:none;width:26px;height:26px;stroke:var(--acdeep);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sheet .cardimg{max-height:48vh;object-fit:contain;background:var(--bg)}
.sheet .back{background:none;border:0;color:var(--acdeep);text-align:left;padding:0;font-size:15px}
/* きづきシート */
.chips.small .chip{padding:6px 14px;font-size:15px}
.chip[aria-pressed="true"]{border-color:var(--ac);background:var(--acsoft);font-weight:700}
.ntiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.ntiles{grid-template-columns:1fr}}
.ntile{background:var(--s);border:2px solid transparent;border-radius:18px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;cursor:text}
.ntile:focus-within{border-color:var(--c)}
.nt-h{display:flex;align-items:center;gap:6px;font-weight:700;color:var(--c);font-size:16px}
.nt-h svg{width:24px;height:24px;stroke:var(--c);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

はじめかた":"なにからかんがえる？ しんろせんたくのはじめかた","保護者等と話すカード":"ほごしゃとうとはなすかーど","就職：学校を通して応募するしくみ":"しゅうしょく：がっこうをとうしておうぼするしくみ","奨学金のしくみと種類":"しょうがくきんのしくみとしゅるい","強みを生かす、いろいろな入試方法":"つよみをいかす、いろいろなにゅうしほうほう","大学入試での配慮（合理的配慮）":"だいがくにゅうしでのはいりょ（ごうりてきはいりょ）","障がい者雇用":"しょうがいものこよう","職業体験（いろいろな仕事の現場）":"しょくぎょうたいけん（いろいろなしごとのげんば）","今年度の進路カレンダーをつくる":"こんねんどのしんろかれんだーをつくる","資格をめざす学校で使えるお金（修学資金など）":"しかくをめざすがっこうでつかえるおきん（しゅうがくしきんなど）","合格体験記を読む（先輩のノートも）":"ごうかくたいけんきをよむ（せんぱいののーとも）","専門学校の入試・試験での配慮（合理的配慮）":"せんもんがっこうのにゅうし・しけんでのはいりょ（ごうりてきはいりょ）","大学・短大の学費":"だいがく・たんだいのがくひ","専門学校の学費":"せんもんがっこうのがくひ","働くときのルール（アルバイトでも守られる）":"はたらくときのるーる（あるばいとでもまもられる）","進路選択の4つのステップを書いてみる":"しんろせんたくの4つのすてっぷをかいてみる","自分を知る3つの手がかりを書き出す":"じぶんをしる3つのてがかりをかきだす","締め切りから逆算して予定を立てる（ワーク）":"しめきりからぎゃくさんしてよていをたてる（わーく）","候補から1つに決める（ワーク）":"こうほから1つにきめる（わーく）","志望理由書と小論文の準備（ワーク）":"しぼうりゆうしょとしょうろんぶんのじゅんび（わーく）","一人暮らしの費用を計算してみる（ワーク）":"ひとりぐらしのひようをけいさんしてみる（わーく）","進路相談室を使おう":"しんろそうだんしつをつかおう","大学・短大・専門学校を調べる（マナビジョン）":"だいがく・たんだい・せんもんがっこうをしらべる（まなびじょん）","共通テストの科目":"きょうつうてすとのかもく","清明高校の模試の申し込み":"せいめいこうこうのもしのもうしこみ","就労支援":"しゅうろうしえん","担任の先生に、今の候補と理由を話す。 相談シートに書いてから話すと、話しやすい。":"たんにんのせんせいに、いまのこうほとりゆうをはなす。 そうだんしーとにかいてからはなすと、はなしやすい。","何から話せばいいかわからなくても大丈夫。 相談シートに書いてから話すと、話しやすい。":"なにからはなせばいいかわからなくてもだいじょうぶ。 そうだんしーとにかいてからはなすと、はなしやすい。","進路の情報・手続きのことなら。 相談シートに書いてから話すと、話しやすい。":"しんろのじょうほう・てつづきのことなら。 そうだんしーとにかいてからはなすと、はなしやすい。","気持ちのこと、しんどいこと。カウンセラーなど、話を聞いてくれる人もいる。まずは担任か教育相談部の先生に相談してみて。 相談シートに書いてから話すと、話しやすい。":"きもちのこと、しんどいこと。かうんせらーなど、はなしをきいてくれるにんもいる。まずはたんにんかきょういくそうだんぶのせんせいにそうだんしてみて。 そうだんしーとにかいてからはなすと、はなしやすい。","「どう考えてる？」とひとこと聞くだけでいい。比べて落ちこみそうなら、やらなくていい。 相談シートに書いてから話すと、話しやすい。":"「どうかんがえてる？」とひとこときくだけでいい。くらべておちこみそうなら、やらなくていい。 そうだんしーとにかいてからはなすと、はなしやすい。","先輩の話は、先生の話とはちがうヒントになる。 相談シートに書いてから話すと、話しやすい。":"せんぱいのはなしは、せんせいのはなしとはちがうひんとになる。 そうだんしーとにかいてからはなすと、はなしやすい。","話すきっかけになる問いを1つ選んで、保護者等と話してみる。例：「高校を出たら、どうしてほしいと思ってる？」":"はなすきっかけになるといを1つえらんで、ほごしゃとうとはなしてみる。れい：「こうこうをでたら、どうしてほしいとおもってる？」","返さなくてよい「給付型」と、返す「貸与型」。日本学生支援機構の給付型・第一種（利子なし）・第二種（利子あり）と、そのほかの奨学金。申し込みの時期。":"かえさなくてよい「きゅうふかた」と、かえす「たいよかた」。にほんがくなましえんきこうのきゅうふかた・だいいっしゅ（りしなし）・だいにしゅ（りしあり）と、そのほかのしょうがくきん。もうしこみのじき。","アルバイトで身につくこと、進路につながること、進路との両立、収入と家族の手続き。":"あるばいとでみにつくこと、しんろにつながること、しんろとのりょうりつ、しゅうにゅうとかぞくのてつづき。","学力試験だけではない入り方がある。自分の強みに合う方法をさがそう。":"がくりょくしけんだけではないいりほうがある。じぶんのつよみにあうほうほうをさがそう。","一般の求人と障がい者雇用の求人。法定雇用率、働きやすくするための配慮、相談できるところ。":"いっぱんのきゅうじんとしょうがいものこようのきゅうじん。ほうていこようりつ、はたらきやすくするためのはいりょ、そうだんできるところ。","カウンセリングや通級など、話せる場所がある。使いたいときは、担任か教育相談部の先生に相談してみて。 相談シートに書いてから話すと、話しやすい。":"かうんせりんぐやつうきゅうなど、はなせるばしょがある。つかいたいときは、たんにんかきょういくそうだんぶのせんせいにそうだんしてみて。 そうだんしーとにかいてからはなすと、はなしやすい。","一人で抱えずに相談を。 相談シートに書いてから話すと、話しやすい。":"ひとりでかかえずにそうだんを。 そうだんしーとにかいてからはなすと、はなしやすい。","一人でかかえなくていい。支えてくれる人（スクールソーシャルワーカーなど）もいるので、担任か教育相談部の先生に相談してみて。 相談シートに書いてから話すと、話しやすい。":"ひとりでかかえなくていい。ささえてくれるにん（すくーるそーしゃるわーかーなど）もいるので、たんにんかきょういくそうだんぶのせんせいにそうだんしてみて。 そうだんしーとにかいてからはなすと、はなしやすい。","仕事の現場をのぞいてみよう。":"しごとのげんばをのぞいてみよう。","保護者等と一緒に、数分で目安がわかる（JASSO）。":"ほごしゃとうといっしょに、すうふんでめやすがわかる（JASSO）。","先輩が、いつ・何をして進路を決めたか。参考になるノートもいっしょに入っている。自分の年次でできることを1つ見つけよう。":"せんぱいが、いつ・なにをしてしんろをきめたか。さんこうになるのーともいっしょにいっっている。じぶんのねんじでできることを1つみつけよう。","配慮のお願いのしかたは学校ごとにちがう。募集要項で「受験上の配慮」の欄を見て、出願の前に学校へ相談する。まず担任か進路支援部の先生に話してみよう。":"はいりょのおねがいのしかたはがっこうごとにちがう。ぼしゅうようこうで「じゅけんうえのはいりょ」のらんをみて、しゅつがんのまえにがっこうへそうだんする。まずたんにんかしんろしえんぶのせんせいにはなしてみよう。","入学金・授業料など、入学から卒業までにかかるお金のめやす。国公立と私立のちがい。":"にゅうがくきん・じゅぎょうりょうなど、にゅうがくからそつぎょうまでにかかるおきんのめやす。こくこうりつとしりつのちがい。","入学金・授業料・実習費など、入学から卒業までにかかるお金のめやす。":"にゅうがくきん・じゅぎょうりょう・じっしゅうひなど、にゅうがくからそつぎょうまでにかかるおきんのめやす。","労働条件通知書、働く時間と休けい、最低賃金、有給休暇、やめるときのルール、困ったときの相談先。":"ろうどうじょうけんつうちしょ、はたらくじかんときゅうけい、さいていちんぎん、ゆうきゅうきゅうか、やめるときのるーる、こまったときのそうだんさき。","自分を知る・道を知る・くらべてえらぶ・準備する。いまの自分を4つのステップに書きこむ。":"じぶんをしる・みちをしる・くらべてえらぶ・じゅんびする。いまのじぶんを4つのすてっぷにかきこむ。","好きなこと・得意なこと・大切にしたいことを書き出す。苦手なことと、やりやすくなる工夫も。":"すきなこと・とくいなこと・たいせつにしたいことをかきだす。にがてなことと、やりやすくなるくふうも。","締め切りと自分の締め切りを決めて、やることを「いつまでに」で書き出す。":"しめきりとじぶんのしめきりをきめて、やることを「いつまでに」でかきだす。","大事にしたいことを3つ決めて、候補に○△×をつけてくらべる。決めた理由もメモする。":"だいじにしたいことを3つきめて、こうほに○△×をつけてくらべる。きめたりゆうもめもする。","求める学生像・学びたい理由・学んで何をしたいか。小論文は「わたしは〇〇と考える。なぜなら」で組み立てる。":"もとめるがくせいぞう・まなびたいりゆう・まなんでなにをしたいか。しょうろんぶんは「わたしは〇〇とかんがえる。なぜなら」でくみたてる。","1か月に入るお金と出るお金を書くと、合計と「のこり」が自動で出る。はじめにかかるお金も計算できる。":"1かがつにいるおきんとでるおきんをかくと、ごうけいと「のこり」がじどうででる。はじめにかかるおきんもけいさんできる。","赤本・合格体験記・大学の情報の本・パンフレット・過去の求人票など。進路の資料を見たり、先生に相談したりできる。":"あかほん・ごうかくたいけんき・だいがくのじょうほうのほん・ぱんふれっと・かこのきゅうじんひょうなど。しんろのしりょうをみたり、せんせいにそうだんしたりできる。","学校の情報を、分野や地域から調べられるサイト（ベネッセ）。":"がっこうのじょうほうを、ぶんややちいきからしらべられるさいと（べねっせ）。","7教科21科目から、受けたい大学・学部が求める科目を選んで受ける。出願と試験の時期のめやす。":"7きょうか21かもくから、うけたいだいがく・がくぶがもとめるかもくをえらんでうける。しゅつがんとしけんのじきのめやす。","マナビジョンの登録→チームズの案内で申し込み→支払い。年次ごとに受ける模試と時期。":"まなびじょんのとうろく→ちーむずのあんないでもうしこみ→しはらい。ねんじごとにうけるもしとじき。","就労選択支援・就労移行支援・就労継続支援（A型・B型）・就労定着支援。市町村の窓口で相談する。":"しゅうろうせんたくしえん・しゅうろういこうしえん・しゅうろうけいぞくしえん（Aかた・Bかた）・しゅうろうていちゃくしえん。しちょうそんのまどぐちでそうだんする。","いつまでに、何をすればいい？":"いつまでに、なにをすればいい？","専門学校に行きたい":"せんもんがっこうにいきたい","面接や小論文への準備":"めんせつやしょうろんぶんへのじゅんび","好きなことを、進路につなげたい":"すきなことを、しんろにつなげたい","見学や体験に行ってみたい":"けんがくやたいけんにいってみたい","受験のときの配慮（合理的配慮）を知りたい":"じゅけんのときのはいりょ（ごうりてきはいりょ）をしりたい","どうやって入る？ いつ出願する？":"どうやっている？ いつしゅつがんする？","いくつかの分野や学校を、くらべて決めたい":"いくつかのぶんややがっこうを、くらべてきめたい","専門学校、どこを見て選べばいい？（資格・合格率・お金）":"せんもんがっこう、どこをみてえらべばいい？（しかく・ごうかくりつ・おきん）","いろいろな仕事の現場を、見てみたい":"いろいろなしごとのげんばを、みてみたい","入試や試験のときの配慮（合理的配慮）を知りたい":"にゅうしやしけんのときのはいりょ（ごうりてきはいりょ）をしりたい","志望理由書・小論文・自己PRの書き方":"しぼうりゆうしょ・しょうろんぶん・じこPRのかきかた","アピールできることを増やしたい（バイト・行事もOK）":"あぴーるできることをふやしたい（ばいと・ぎょうじもOK）","強みを生かせる入試方法は？":"つよみをいかせるにゅうしほうほうは？","学費":"がくひ","奨学金などについて知りたい！":"しょうがくきんなどについてしりたい！"},"stamp":"2026-11-12T10:06:11.476Z"}</script>
<script type="application/json" id="cs-tpl">{"oyako":"\u003ctitle>おうちの方へ\u003c/title>\r\n\u003cmeta name=\"robots\" content=\"noindex,nofollow\">\r\n\u003clink href=\"https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap\" rel=\"stylesheet\">\r\n\u003cstyle>\r\n:root{color-scheme:light;--bg:#FFFFFF;--tx:#1A3040;--mute:#4F6878;--line:#BFD8E3;--ac:#2E7D9A;--acsoft:#E8F4F8;--acdeep:#1C5F78}\r\n*{box-sizing:border-box}\r\nbody{margin:0;background:var(--bg);color:var(--tx);font-family:\"BIZ UDPGothic\",\"Meiryo\",sans-serif;font-size:16px;line-height:1.75}\r\n.sheet{max-width:760px;margin:0 auto;padding-block:28px;padding-inline:16px;display:flex;flex-direction:column;gap:18px}\r\nh1{margin:0;font-size:26px}\r\n.lead{margin:0;color:var(--mute)}\r\nsection{border:2px solid var(--line);border-radius:14px;padding:14px 18px}\r\nh2{margin:0 0 6px;font-size:19px;color:var(--acdeep)}\r\nul{margin:0;padding-left:1.2em}\r\nli{margin:3px 0}\r\n.foot{font-size:13px;color:var(--mute)}\r\na{color:var(--acdeep)}\r\n@media print{.sheet{padding-block:0}section{break-inside:avoid}}\r\n\u003c/style>\r\n\u003cdiv class=\"sheet\">\r\n  \u003ch1>おうちの方へ（進路のこと）\u003c/h1>\r\n  \u003cp class=\"lead\">清明高校では、生徒が自分で「今日の一歩」を選べるアプリ「清明キャリアApps」を使っています。おうちの方にお願いしたいことを、3つだけまとめました。\u003c/p>\r\n  \u003csection>\u003ch2>1　関わり方の目安\u003c/h2>\u003cul>\r\n    \u003cli>答えを教えるより、「そういえば〇〇が好きだったね」と覚えていることを伝えてください。\u003c/li>\r\n    \u003cli>ご自身の経験は「正解」ではなく「一つの例」として話していただくと、選択肢が広がります。\u003c/li>\r\n    \u003cli>話したがらないときは、無理に聞き出さず「話したくなったらいつでも」と伝えるだけで十分です。\u003c/li>\r\n    \u003cli>できたことを具体的に一つ伝えていただくのが、次の一歩の一番の後押しになります。\u003c/li>\u003c/ul>\u003c/section>\r\n  \u003csection>\u003ch2>2　お金のこと（早めに）\u003c/h2>\u003cul>\r\n    \u003cli>進学を考えるなら、返さなくてよい奨学金と授業料の減免（修学支援新制度）は、卒業する年度の春に学校を通して申し込みます。\u003c/li>\r\n    \u003cli>対象になるかの目安：\u003ca href=\"https://shogakukin-simulator.jasso.go.jp/\">JASSO 進学資金シミュレーター\u003c/a>（数分でわかります）\u003c/li>\r\n    \u003cli>受験料・入学金は、奨学金より先に払う時期があります。支払い時期を一緒に確認してください。\u003c/li>\u003c/ul>\u003c/section>\r\n  \u003csection>\u003ch2>3　学校への連絡\u003c/h2>\u003cp style=\"margin:0\">__CONTACT__\u003c/p>\u003c/section>\r\n  \u003cp class=\"foot\">京都府立清明高等学校 進路支援部　／　清明キャリアApps __VER__\u003c/p>\r\n\u003c/div>\r\n\u003cscript>\r\nconst D = /*__DATA__*/{};\r\ndocument.body.innerHTML = document.body.innerHTML.replace('__CONTACT__', (D.set && D.set['保護者の連絡の案内']) || '').replace('__VER__', D.v || '');\r\n\u003c/script>\r\n"}</script>

function recommend(){
  if(D.routes){ const one = cn => { const key = `${P.michi || ''}|${S.status}|${cn}`; return D.routes[key] || D.routes[`|${S.status}|${cn}`] || []; };
    const cs = (S.concerns && S.concerns.length) ? S.concerns : [S.concern || 'none'];
    const lists = cs.map(one); const out = []; // 選んだ「気になること」のおすすめを、1つずつ交互に並べる
    for(let i = 0; lists.some(l => i < l.length); i++) lists.forEach(l => { if(l[i] && !out.includes(l[i])) out.push(l[i]); });
    return out.map(id => CON[id]).filter(Boolean); }
  const st = D.status.find(s => s.no === S.status) || D.status[0];
  const pri = st.kids;
  const recent = P.recs.slice(-6).map(r => r.id);
  return D.contents.filter(c => c.dan < 3 && (c.boost ?? 1) > 0).map(c => {
    let s = 0;
    (c.kids||[]).forEach(k => { const i = pri.indexOf(k); if(i >= 0) s = Math.max(s, 4 - i); });
    if(S.concern && S.concern !== 'none' && (c.concerns||[]).includes(S.concern)) s += 5;
    const m = c.michi || [];
    if(!m.includes('すべて')){
      if(P.michi && m.includes(P.michi)) s += 1.5;
      else if(m.some(x => ['配慮','外国籍','家を出る'].includes(x))) s -= 4;
      else s -= 3;
    }
    if(c.nenji && c.nenji.length){ s += (P.nenji && nenjiSet().some(g => c.nenji.includes(g))) ? 1 : (P.nenji ? -3 : 0); }
    if(S.status === '5'){ const m2 = parseInt(c.meyasu); if(m2 && m2 <= 10) s += 1.5; if(/授業|継続|半日|1日/.test(c.meyasu||'')) s -= 2; }
    if(recent.includes(c.id)) s -= 3;
    if(c.state === '公開' || c.state === '実施中') s += .3;
    s += ((c.boost ?? 1) - 1) * 1.5;
    return {c, s};
  }).filter(x => x.s > 0).sort((a,b) => b.s - a.s || a.c.id.localeCompare(b.c.id)).map(x => x.c);
}

/* ---------- コード（QR・バックアップ） ---------- */
async function pack(tag, obj){
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  let out = bytes, z = false;
  if(window.CompressionStream){ try{ const cs = new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'));
    out = new Uint8Array(await new Response(cs).arrayBuffer()); z = true; }catch(e){ out = bytes; } }
  let b = ''; out.forEach(x => b += String.fromCharCode(x));
  return `CS6${tag}${z ? '' : 'J'}:` + btoa(b).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
async function unpack(code){
  const m = String(code).trim().match(/^CS6([ZNFJ])(J?):(.+)$/);
  if(!m) throw new Error('コードの形がちがいます（CS6 から始まる文字列です）');

/* ===== マスタ（清明キャリアApps_マスタv10.xlsx）の読み書きとチェック。アプリの編集者画面・ダッシュボード・build.js で共通 ===== */
const WS_KIND = {'一行':'line','文章':'text','ひとつ選ぶ':'one','いくつでも選ぶ':'many','段階':'scale','表（書く）':'grid','表（○△×）':'mark','グラフ':'chart','説明':'info'};
const WS_KIND_JA = Object.fromEntries(Object.entries(WS_KIND).map(([k, v]) => [v, k]));
const MICHI_JA = {'大学':'大学・短大','専門':'専門学校','就職':'就職','':'まだ決めていない・迷っている'};

function parseMaster(XLSX, wb){
  const P = [];
  const splitK = v => String(v ?? '').split(/[、,／\/]/).map(x => x.trim()).filter(Boolean);
  const splitS = v => String(v ?? '').split(/／|\n/).map(x => x.trim()).filter(Boolean);
  const rowsOf = name => wb.Sheets[name] ? XLSX.utils.sheet_to_json(wb.Sheets[name], {header:1, defval:''}) : [];
  const table = name => { const a = rowsOf(name); const h = a[1] || []; return a.slice(2).filter(r => r[0] !== '' && r[0] != null).map(r => Object.fromEntries(h.map((k, i) => [k, r[i]]).filter(([k]) => k))); };
  const need = ['分岐一覧','コンテンツ','マップ（問い）','IDの引き継ぎ','小項目','いまの自分','気になること','時期のおしらせ','相談先','ことば','設定'];
  const miss = need.filter(n => !wb.Sheets[n]);
  if(miss.length) return {P:[`マスタにシート「${miss.join('」「')}」がありません。清明キャリアApps（キャリアステップ）のマスタ（v7以降）を選んでいるか確かめてください。`]};
  const no = v => ['×','x','X','✕'].includes(String(v ?? '').trim());
  // 体制一覧表（先生用。アプリには入れない。なくてもよい）
  const t = rowsOf('体制一覧表'); const H = t[1] || []; const BUN = H.slice(6, 14);
  const TROWS = t.slice(2).filter(r => /^[ABC]\d$/.test(String(r[1]).trim())).map(r => ({id:String(r[1]).trim(), pillar:r[0], name:r[2], sugata:r[3], step:r[4], q:r[5],
    cells:Object.fromEntries(BUN.map((b, i) => [b, r[6 + i] || ''])), fill:r[14] || '', next:r[15] || ''}));
  const OFF = Object.fromEntries(TROWS.map(r => [r.id, r]));
  const DAICHO = table('取り組み台帳').filter(r => !/^(※|（記入）)/.test(String(r['取り組み名']))).map(r => ({name:r['取り組み名'], bun:r['担当分掌'], nenji:r['対象年次'], time:r['時期'], form:r['形態'],
    kids:splitK(r['対応する小項目ID']), step:r['キャリアステップ'], aim:r['ねらい（何のために）'], eval:r['評価の手がかり'], note:r['備考']}));
  const TAIOU = table('アンケート対応表').map(r => ({q:r['アンケートで見る数値'], why:r['低いときに疑うこと'], kids:splitK(r['見直す小項目']), bun:r['主に動く分掌']}));
  // 小項目
  const KIDS = table('小項目').map(r => { const id = String(r['ID']).trim(); const o = OFF[id] || {};
    return {id, pillar:o.pillar || r['柱'] || '', name:r['生徒向けの名前'] || o.name || id, ask:r['問いかけ'] || '', links:splitK(r['つながり（マップの線）']),
      official:o.name || r['小項目（正式・体制一覧表から）'] || '', sugata:o.sugata || '', q:o.q || r['対応する調査の設問'] || ''}; });
  const KI = new Set(KIDS.map(k => k.id));
  KIDS.forEach(k => { if(!k.pillar) P.push(`小項目 ${k.id} の柱がわかりません（「体制一覧表」か「小項目」の柱の列）`);
    k.links.forEach(x => { if(!KI.has(x)) P.push(`小項目：${k.id} のつながり「${x}」がありません`); }); });
  // コンテンツ（表示×も残す。アプリが表示のときに外す）
  const CONTENTS = [], ALLIDS = new Set();
  table('コンテンツ').forEach(r => {
    const id = String(r['ID']).trim(); if(!id) return;
    if(ALLIDS.has(id)){ P.push(`コンテンツ：ID「${id}」が2回出てきます（2つ目は読みません）`); return; } ALLIDS.add(id);
    const kids = splitK(r['小項目']).filter(k => KI.has(k));
    CONTENTS.push({id, title:r['タイトル'] || id, desc:r['ひとこと説明'] || '', kind:r['種類'] || 'サイト', url:String(r['URL'] || '').trim(), state:r['状態'] || '', hide:no(r['表示']), kids,
      concerns:splitK(r['気になること']), michi:splitK(r['道']).length ? splitK(r['道']) : ['すべて'], nenji:splitK(r['年次']), meyasu:String(r['目安'] || ''),
      bun:r['担当分掌'] || '', dan:parseInt(r['たすけ段階'] || 1) || 1, box:r['資料箱の場所'] || '', write:r['その場で書く問い'] || '', tori:r['体制表の取り組み'] || '',
      links:splitK(r['つながるコンテンツ（ID）']), img:r['見本画像'] || '', sheet:String(r['ワークシート'] || '').trim()});
  });
  // IDの引き継ぎ
  const ALIAS = {};
  table('IDの引き継ぎ').forEach(r => { const o = String(r['旧ID']).trim(), to = String(r['引き継ぎ先ID（空欄＝なくなった）'] || '').trim();
    if(!/^c\d+$/.test(o)) return;
    ALIAS[o] = {to, title:r['旧タイトル'] || '', kids:splitK(r['旧小項目']), ver:r['変えた版'] || '', memo:r['メモ'] || ''}; });
  const fix = id => { let x = id, n = 0; while(!ALLIDS.has(x) && ALIAS[x] && ALIAS[x].to && n++ < 9) x = ALIAS[x].to; return x; };
  // マップ（問いの木）
  const TREE = [];
  rowsOf('マップ（問い）').slice(2).forEach((r, i) => {
    const big = String(r[0] || '').trim(), sub = String(r[1] || '').trim(); let id = String(r[3] || '').trim();
    if(!big && !sub && !id) return;
    if(!big || !sub){ P.push(`マップ（問い） ${i + 3}行目：大きな問いと具体的な問いの両方を書いてください`); return; }
    let b = TREE.find(x => x.q === big); if(!b){ b = {q:big, subs:[]}; TREE.push(b); }
    let s2 = b.subs.find(x => x.q === sub); if(!s2){ s2 = {q:sub, ids:[]}; b.subs.push(s2); }
    if(!id) return;
    if(!ALLIDS.has(id) && ALIAS[id]) id = fix(id);
    if(!ALLIDS.has(id)){ P.push(`マップ（問い） ${i + 3}行目：ID「${id}」が「コンテンツ」シートにありません`); return; }
    s2.ids.push([parseInt(r[2]) || 99, id]);
  });
  TREE.forEach(b => b.subs.forEach(s2 => { s2.ids = s2.ids.sort((a, c) => a[0] - c[0]).map(x => x[1]).filter((v, i, a) => a.indexOf(v) === i); }));
  // いまの自分・気になること
  const STATUS = table('いまの自分').map(r => ({no:String(r['番号']).trim(), label:r['選択肢（設問17と同文）'] || r['選択肢（設問20と同文）'] || '', msg:r['ひとこと'] || '', hint:r['えらぶ画面の補足（生徒に見える）'] || ''}));
  const CINFO = {}; const CONCERNS = [];
  table('気になること').forEach(r => { const n = String(r['表示名']).trim(); if(!n) return; CINFO[n] = {q:r['対応する設問'] || '', memo:r['説明（先生用）'] || '', hint:r['生徒向けの補足（えらぶ画面）'] || ''}; if(!no(r['表示'])) CONCERNS.push(n); });
  // 分岐一覧 → routes["道|番号|気になること"] = [ID…]
  const MI = {'大学・短大':'大学','専門学校':'専門','就職':'就職'};
  const ROUTES = {};
  rowsOf('分岐一覧').slice(2).forEach((r, i) => {
    if(!r[0]) return;
    const key = `${MI[String(r[0]).trim()] ?? ''}|${String(r[1]).trim().charAt(0)}|${String(r[2]).trim() === 'とくにない' ? 'none' : String(r[2]).trim()}`;
    let id = String(r[4] || '').trim(); const rank = parseInt(r[3]) || 99;
    (ROUTES[key] = ROUTES[key] || []);
    if(!id) return;
    if(!ALLIDS.has(id) && ALIAS[id]){ const t2 = fix(id); P.push(`分岐一覧 ${i + 3}行目：${id} はなくなったID${t2 !== id ? `（${t2} を出します）` : ''}`); if(t2 === id) return; id = t2; }
    if(!ALLIDS.has(id)){ P.push(`分岐一覧 ${i + 3}行目：ID「${id}」が「コンテンツ」シートにありません`); return; }
    ROUTES[key].push([rank, id]);
  });
  Object.keys(ROUTES).forEach(k => { ROUTES[k] = ROUTES[k].sort((a, b) => a[0] - b[0]).map(x => x[1]).filter((v, i, a) => a.indexOf(v) === i); });
  const NOTICES = table('時期のおしらせ').map(r => ({nenji:splitK(r['年次']), from:parseInt(r['開始月']) || 4, to:parseInt(r['終了月']) || 3, michi:splitK(r['道']).length ? splitK(r['道']) : ['すべて'], title:r['タイトル'] || '', body:r['内容'] || '', rel:splitK(r['関連コンテンツ'])}));
  const SOUDAN = table('相談先').map(r => ({id:r['ID'], name:r['名前'] || '', what:r['何を相談できるか'] || '', where:r['学内／学外'] || '学内', url:r['連絡・URL'] || ''}));
  const WORDS = table('ことば').map(r => ({w:String(r['語']), y:r['よみ'] || '', d:r['やさしい説明'] || ''}));
  const SET = Object.fromEntries(table('設定').map(r => [r['項目'], r['値']]));
  // ワークシート（v9。なくてもよい）
  let SHEETS = null;
  if(wb.Sheets['ワークシート']){
    SHEETS = [];
    table('ワークシート').forEach((r, i) => {
      const wid = String(r['ワークID']).trim(); if(!wid) return;
      let w = SHEETS.find(x => x.id === wid); if(!w){ w = {id:wid, title:r['ワーク名'] || wid, intro:r['ワークの説明（1行目だけ）'] || '', pages:[]}; SHEETS.push(w); }
      const pn = String(r['ページ'] || '').trim() || '1';
      let pg = w.pages[w.pages.length - 1]; if(!pg || pg.title !== pn){ pg = {title:pn, fields:[]}; w.pages.push(pg); }
      const k = WS_KIND[String(r['種類'] || '').trim()];
      if(!k){ P.push(`ワークシート ${i + 3}行目：種類「${r['種類']}」がわかりません（${Object.keys(WS_KIND).join('／')}）`); return; }
      const f = {k:`${w.pages.length - 1}-${pg.fields.length}`, t:k, q:String(r['問い・見出し'] || '')};
      const a = splitS(r['選択肢・行（／で区切る）']), c = splitS(r['列（表のとき・／で区切る）']);
      if(k === 'one' || k === 'many' || k === 'scale') f.ch = a;
      if(k === 'grid' || k === 'mark'){ f.rows = a; f.cols = c.length ? c : ['']; }
      if(k === 'chart'){ f.rows = a; f.style = /棒/.test(c[0] || '') ? 'bar' : 'radar'; if(c[1]) f.unit = c[1]; f.max = parseInt(r['字数の目安']) || 5; }
      if(r['ヒント']) f.hint = String(r['ヒント']);
      if(k === 'text' && parseInt(r['字数の目安'])) f.goal = parseInt(r['字数の目安']);
      if(k === 'grid' && /^\s*\{/.test(String(r['字数の目安'] || ''))){ try { f.sum = JSON.parse(r['字数の目安']); } catch(e){ P.push(`ワークシート ${i + 3}行目：合計の決まり（字数の目安の列）が読めません`); } }
      pg.fields.push(f);
    });
  }
  const D = {v:SET['版'] || 'v10', kids:KIDS, contents:CONTENTS, tree:TREE, alias:ALIAS, status:STATUS, concerns:CONCERNS, concernInfo:CINFO, routes:ROUTES, notices:NOTICES, soudan:SOUDAN, words:WORDS, set:SET,
    taisei:{bunsho:BUN, rows:TROWS, daicho:DAICHO, taiou:TAIOU}};
  if(SHEETS) D.sheets = SHEETS;
  const tn = DAICHO.length ? new Set(DAICHO.map(d => d.name)) : null;
  if(tn) CONTENTS.forEach(c => { if(c.tori && !tn.has(c.tori)) P.push(`コンテンツ ${c.id}：体制表の取り組み「${c.tori}」が「取り組み台帳」にありません`); });
  return {P:[...P, ...checkData(D)], D};
}

/* ===== 中身のチェック（編集者画面でも使う）。生徒の画面がこわれないかを見る ===== */
function checkData(D){
  const P = [];
  const KI = new Set((D.kids || []).map(k => k.id));
  const ALL = new Set((D.contents || []).map(c => c.id));
  const VIS = new Set((D.contents || []).filter(c => !c.hide).map(c => c.id));
  const SH = new Set((D.sheets || []).map(w => w.id));
  const CONC = new Set(D.concerns || []);
  (D.contents || []).forEach(c => {
    if(c.hide) return;
    const nm = `コンテンツ ${c.id}（${c.title}）`;
    if(!c.kids.length || c.kids.some(k => !KI.has(k))) P.push(`${nm}：小項目（A1〜C5）を1つ以上えらんでください`);
    if(c.sheet && !SH.has(c.sheet)) P.push(`${nm}：ワークシート「${c.sheet}」がありません`);
    if(!c.sheet && !/^https?:\/\//.test(c.url || '')) P.push(`${nm}：URLが空か、http で始まっていません`);
    (c.links || []).forEach(x => { if(!ALL.has(x)) P.push(`${nm}：つながるコンテンツ「${x}」がありません`); });
    (c.concerns || []).forEach(x => { if(!CONC.has(x)) P.push(`${nm}：気になること「${x}」が選択肢にありません（表示しない設定かもしれません）`); });
  });
  (D.tree || []).forEach(b => b.subs.forEach(s => {
    s.ids.forEach(id => { if(!ALL.has(id)) P.push(`マップ「${b.q} → ${s.q}」：コンテンツ「${id}」がありません`); });
    if(!s.ids.some(id => VIS.has(id))) P.push(`マップ「${b.q} → ${s.q}」：表示するコンテンツが1つもありません（マップに出ません）`); }));
  const inTree = new Set((D.tree || []).flatMap(b => b.subs.flatMap(s => s.ids)));
  (D.contents || []).forEach(c => { if(!c.hide && !inTree.has(c.id)) P.push(`コンテンツ ${c.id}（${c.title}）：マップのどこにも入っていません（マップから見つけられません）`); });
  (D.kids || []).forEach(k => { if(!(D.contents || []).some(c => !c.hide && c.kids.includes(k.id))) P.push(`小項目 ${k.id}（${k.name}）：表示するコンテンツが1つもありません`); });
  ['大学','専門','就職',''].forEach(m => (D.status || []).forEach(s => [...(D.concerns || []), 'none'].forEach(cn => {
    if(m === '' && s.no === '1') return; // 未定の生徒には ① を出さない
    const ids = (D.routes || {})[`${m}|${s.no}|${cn}`] || (D.routes || {})[`|${s.no}|${cn}`] || [];
    if(!ids.some(id => VIS.has(id))) P.push(`おすすめ：「${MICHI_JA[m] || m} × ${s.no} ${s.label} × ${cn === 'none' ? 'とくにない' : cn}」に出すものがありません`); })));
  Object.entries(D.routes || {}).forEach(([k, ids]) => ids.forEach(id => { if(!ALL.has(id)) P.push(`おすすめ「${k.replace(/\|/g, ' × ')}」：コンテンツ「${id}」がありません`); }));
  (D.notices || []).forEach(n => (n.rel || []).forEach(x => { if(!ALL.has(x)) P.push(`時期のおしらせ「${n.title}」：関連コンテンツ「${x}」がありません`); }));
  (D.sheets || []).forEach(w => { if(!w.pages.length || !w.pages.some(p => p.fields.length)) P.push(`ワークシート ${w.id}（${w.title}）：欄が1つもありません`);
    w.pages.forEach(p => p.fields.forEach(f => { if(['one','many','scale'].includes(f.t) && !(f.ch || []).length) P.push(`ワークシート ${w.id}「${f.q}」：選択肢がありません`);
      if(['grid','mark','chart'].includes(f.t) && !(f.rows || []).length) P.push(`ワークシート ${w.id}「${f.q}」：表の行がありません`); })); });
  Object.entries(D.alias || {}).forEach(([o, a]) => { if(ALL.has(o)) P.push(`IDの引き継ぎ：${o} はまだコンテンツにあります`); if(a.to && !ALL.has(a.to)) P.push(`IDの引き継ぎ：${o} の引き継ぎ先「${a.to}」がありません`); });
  return [...new Set(P)];
}

/* 色つきのマスタ（ExcelJS）。orig＝もとのマスタ（ArrayBuffer・なくてもよい）から先生用のシートを写す */
async function makeMasterStyled(ExcelJS, D, orig){
  const wb = new ExcelJS.Workbook(); wb.creator = '清明キャリアApps 編集者画面';
  const F = {name:'Meiryo UI', size:10, color:{argb:'FF1A3040'}};
  const fill = c => ({type:'pattern', pattern:'solid', fgColor:{argb:'FF' + c}});
  const line = {style:'thin', color:{argb:'FFBFD8E3'}}; const border = {top:line, left:line, bottom:line, right:line};
  masterSheets(D).forEach(s => {
    const ws = wb.addWorksheet(s.name, {views:[{state:'frozen', ySplit:2}]});
    ws.columns = (s.widths || []).map(w => ({width:w + 2}));
    const n = Math.max(1, s.head.length);
    ws.getCell(1, 1).value = s.note; if(n > 1) ws.mergeCells(1, 1, 1, n);
    ws.getRow(1).height = 48; ws.getCell(1, 1).font = Object.assign({}, F, {bold:true}); ws.getCell(1, 1).alignment = {wrapText:true, vertical:'top'};
    s.head.forEach((h, j) => { const c = ws.getCell(2, j + 1); c.value = h; c.font = Object.assign({}, F, {bold:true, color:{argb:'FF1C5F78'}}); c.fill = fill('C8E0EB'); c.border = border; c.alignment = {wrapText:true, vertical:'middle'}; });
    ws.getRow(2).height = 30;
    const last = s.rows.length + 2 + (s.name === 'はじめに' ? 0 : 40); // 足すための空き行も色をつける
    for(let r = 3; r <= last; r++){
      const vals = s.rows[r - 3];
      for(let j = 1; j <= n; j++){
        const c = ws.getCell(r, j); if(vals) c.value = vals[j - 1] === '' || vals[j - 1] == null ? null : vals[j - 1];
        c.font = F; c.alignment = {wrapText:true, vertical:'top'};
        if(s.name === 'はじめに') continue;
        c.fill = fill((s.edit || []).includes(j) ? 'FFF2C6' : (s.opt || []).includes(j) ? 'FFFAE8' : (s.auto || []).includes(j) ? 'EEF2F4' : 'FFFAE8'); c.border = border;
      }
    }
    Object.entries(s.lists || {}).forEach(([j, list]) => { for(let r = 3; r <= last; r++) ws.getCell(r, +j).dataValidation = {type:'list', allowBlank:true, formulae:[`"${list}"`]}; });
  });
  if(orig){ // 先生用のシート（体制一覧表など）を、もとのマスタから色ごと写す
    const ow = new ExcelJS.Workbook(); await ow.xlsx.load(orig);
    STAFF_SHEETS.forEach(name => { const os = ow.getWorksheet(name); if(!os) return;
      const ws = wb.addWorksheet(name, {views:os.views});
      ws.columns = (os.columns || []).map(c => ({width:c.width}));
      os.eachRow({includeEmpty:true}, (row, r) => { const nr = ws.getRow(r); nr.height = row.height;
        row.eachCell({includeEmpty:true}, (cell, j) => { const c = nr.getCell(j); const v = cell.value;
          c.value = v && typeof v === 'object' && v.formula ? {formula:v.formula, result:v.result} : v; c.style = JSON.parse(JSON.stringify(cell.style || {})); }); });
      ((os.model && os.model.merges) || []).forEach(m => { try{ ws.mergeCells(m); }catch(e){} });
    });
  }
  return wb.xlsx.writeBuffer();
}

/* 表の合計（2026-11-12 追加：一人暮らしの費用ワーク）。f.sum = {col, groups:[{l, rows:[…]}], diff:[a, b, ラベル]}。

/* ---------- 画像・PDFに書き出す（A4たて。1ページ＝1枚の画像） ---------- */

function lum(h){ const c = [1,3,5].map(i => parseInt(h.slice(i, i + 2), 16) / 255).map(v => v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4)); return .2126 * c[0] + .7152 * c[1] + .0722 * c[2]; }
function contrast(a, b){ const x = lum(a), y = lum(b); return (Math.max(x, y) + .05) / (Math.min(x, y) + .05); }
const PRESETS = [['標準（UD・青）', {bg:'#E8F4F8', tx:'#1A3040', ac:'#2E7D9A'}], ['落ちついた緑', {bg:'#EEF5EF', tx:'#1F3326', ac:'#3C7F55'}], ['あたたかい茶', {bg:'#FBF4EA', tx:'#3A2A18', ac:'#A0601C'}], ['白っぽい', {bg:'#F7F9FA', tx:'#1A3040', ac:'#2E7D9A'}]];

  const col = (k, l) => `<div class="erowc"><span class="eul">${l}</span><input type="color" class="ecol" data-p="theme.${k}" data-rr="1" value="${esc(t[k])}"><input type="text" class="ei mono" data-p="theme.${k}" data-rr="1" value="${esc(t[k])}" maxlength="7"></div>`;
  return `${H('色・文字の大きさ', 'UDスタイルの決まり：白抜き文字・蛍光色は使わない。文字と背景の差（コントラスト）は 4.5 : 1 以上。')}

function delContent(i, to){

    case 'tog': { edSnap(); const arr = pget(D2, a) || []; const v = el.dataset.v; pset(D2, a, arr.includes(v) ? arr.filter(x => x !== v) : [...arr, v]); break; }
    case 'set': { if(a.startsWith('__r.')){ ED.r[a.slice(4)] = el.dataset.v; edRender(); return; } edSnap(); pset(D2, a, el.dataset.ty === 'num' ? +el.dataset.v : el.dataset.v); break; }
    case 'swt': { if(a.startsWith('__conc.')){ const n = a.slice(7); edSnap(); D2.concerns = D2.concerns.includes(n) ? D2.concerns.filter(x => x !== n) : [...D2.concerns, n]; break; }
      edSnap(); const isHide = /\.hide$/.test(a); pset(D2, a, !pget(D2, a)); if(!isHide) break; break; }
    case 'mv': { const z = a.split('|'); const d = z.pop(), i = z.pop(), p = z.join('|'); const arr = pget(D2, p); const j = +i + +d; if(j < 0 || j >= arr.length) return; edSnap(); [arr[i], arr[j]] = [arr[j], arr[i]]; if(p.endsWith('.pages')) ED.wp = j; break; }
    case 'del': { const z = a.split('|'); const i = z.pop(), p = z.join('|'); const arr = pget(D2, p); if(/^(tree|notices|soudan|words|opts\.michi)$|\.subs$|\.pages$|\.fields$/.test(p) && !confirm('消しますか？（「元に戻す」で戻せます）')) return; edSnap(); arr.splice(+i, 1); if(p.endsWith('.pages')) ED.wp = 0; break; }
    case 'kf': ED.kf = a; edRender(); return;
    case 'flag': ED.flag = a; edRender(); return;
    case 'csel': ED.sel = a; ED.cdel = false; edRender(); { const d = $('.edetail'); if(d) d.scrollTop = 0; } return;
    case 'cadd': { edSnap(); const id = nextId(D2.contents.map(c => c.id).filter(x => /^c\d+$/.test(x)), 'c'); D2.contents.unshift({id, title:'新しいコンテンツ', desc:'', kind:'動画', url:'', state:'準備中', hide:false, kids:[], concerns:[], michi:['すべて'], nenji:[], meyasu:'', bun:'進路支援部', dan:1, box:'', write:'', tori:'', links:[], img:'', sheet:''});
      ED.sel = id; ED.q = ''; ED.kf = ''; ED.flag = ''; edToast(`${id} を作りました。小項目をえらび、マップとおすすめに入れてください。`); break; }
    case 'cdel': ED.cdel = true; edRender(); return;
    case 'cdelno': ED.cdel = false; edRender(); return;
    case 'cdelok': delContent(+a, ($('#ecdelto') || {}).value || ''); return;
    case 'addlink': { const v = $('#eaddlink').value; if(!v) return; edSnap(); D2.contents[+a].links.push(v); break; }
    case 'addtree': { const v = $('#eaddtree').value; if(!v) return; const [b, s] = v.split('|'); const ids = D2.tree[b].subs[s].ids; if(ids.includes(a)) return; edSnap(); ids.push(a); break; }
    case 'untree': { const [b, s, id] = a.split('|'); edSnap(); const sub = D2.tree[b].subs[s]; sub.ids = sub.ids.filter(x => x !== id); break; }
    case 'addroute': { const key = `${$('#ram').value}|${$('#ras').value}|${$('#rac').value}`; edSnap(); const ids = D2.routes[key] = D2.routes[key] || []; if(!ids.includes(a)) ids.push(a); edToast(`「${rkLabel(key)}」の ${ids.length} 番目に入れました`); break; }
    case 'unroute': { const i = a.lastIndexOf('|'); const k = a.slice(0, i), id = a.slice(i + 1); edSnap(); D2.routes[k] = D2.routes[k].filter(x => x !== id); break; }
    case 'rcreate': edSnap(); D2.routes[a] = [...(D2.routes[`|${ED.r.s}|${ED.r.c}`] || [])]; break;
    case 'raddsel': { const v = $('#eaddr').value; if(!v) return; edSnap(); (D2.routes[a] = D2.routes[a] || []).push(v); break; }
    case 'maddc': { const [b, s] = a.split('|'); const v = $(`#em${b}_${s}`).value; if(!v) return; edSnap(); D2.tree[b].subs[s].ids.push(v); ED.open = +b; break; }
    case 'maddsub': edSnap(); D2.tree[+a].subs.push({q:'新しい問い', ids:[]}); ED.open = +a; break;
    case 'maddbig': edSnap(); D2.tree.push({q:'新しい大きな問い', subs:[{q:'新しい具体的な問い', ids:[]}]}); ED.open = D2.tree.length - 1; break;
    case 'wssel': ED.ws = a; ED.wp = 0; edRender(); return;
    case 'wsgo': ED.page = 'sheets'; ED.ws = a; ED.wp = 0; edRender(); return;
    case 'wsnew': { edSnap(); const id = nextId(D2.sheets.map(w => w.id).filter(x => /^w\d+$/.test(x)), 'w', 900); const c = a ? D2.contents.find(x => x.id === a) : null;
      D2.sheets.push({id, title:c ? c.title : '新しいワークシート', intro:'', pages:[{title:'1', fields:[newField('line'), newField('text')]}]}); if(c) c.sheet = id;
      ED.page = 'sheets'; ED.ws = id; ED.wp = 0; edToast(`${id} を作りました。欄を足して、コンテンツにつないでください。`); break; }
    case 'wsdel': { if(!confirm('このワークシートを消しますか？（生徒が書いたものは生徒の端末に残りますが、アプリでは開けなくなります）')) return; edSnap(); D2.sheets = D2.sheets.filter(w => w.id !== a); D2.contents.forEach(c => { if(c.sheet === a) c.sheet = ''; }); ED.ws = null; break; }
    case 'wslink': { const v = $('#ewslink').value; if(!v) return; edSnap(); D2.contents.find(c => c.id === v).sheet = a; break; }
    case 'wsunlink': edSnap(); D2.contents.find(c => c.id === a).sheet = ''; break;
    case 'wspg': ED.wp = +a; edRender(); return;
    case 'wspadd': { edSnap(); const w = D2.sheets[+a]; w.pages.push({title:String(w.pages.length + 1), fields:[]}); ED.wp = w.pages.length - 1; break; }
    case 'wsfadd': { const [p, t] = a.split('|'); edSnap(); pget(D2, p).push(newField(t)); break; }
    case 'wsfdup': { const [p, i] = a.split('|'); const arr = pget(D2, p); edSnap(); const f = clone(arr[+i]); f.k = newField('line').k; arr.splice(+i + 1, 0, f); break; }
    case 'michiadd': { const v = $('#enewmichi').value.trim(); if(!v) return; if(D2.opts.michi.some(m => m.v === v || m.l === v)){ edToast('同じ名前の道があります'); return; } edSnap(); D2.opts.michi.splice(D2.opts.michi.length - 1, 0, {v, l:v}); break; }
    case 'concadd': { const v = $('#enewconc').value.trim(); if(!v) return; if(D2.concerns.includes(v) || D2.concernInfo[v]){ edToast('同じ名前があります'); return; } edSnap(); D2.concerns.push(v); D2.concernInfo[v] = {q:'（調査なし）', memo:''}; break; }
    case 'concdel': { if(!confirm(`「${a}」を消しますか？ コンテンツの「気になること」と、この名前のおすすめ（分岐）も消えます。`)) return; edSnap();
      D2.concerns = D2.concerns.filter(x => x !== a); delete D2.concernInfo[a]; D2.contents.forEach(c => { c.concerns = c.concerns.filter(x => x !== a); });
      Object.keys(D2.routes).forEach(k => { if(k.split('|')[2] === a) delete D2.routes[k]; }); if(ED.r.c === a) ED.r.c = 'none'; break; }
    case 'uireset': edSnap(); delete D2.ui[a]; break;
    case 'preset': edSnap(); Object.assign(D2.theme, PRESETS[+a][1]); break;
    case 'themereset': edSnap(); D2.theme = Object.assign({}, THEME_DEF); break;
    case 'infotab': ED.info = a; edRender(); return;
    case 'nqadd': { edSnap(); const cols = ['#2E7D9A','#3C7F55','#A8621C','#7A5C8E','#8A5A2B','#3F6E8C']; D2.opts.nq.push({k:'x' + Date.now().toString(36), label:'新しい欄', hint:'', col:cols[D2.opts.nq.length % cols.length], ic:'q'}); break; }
    case 'wspdel': { const [wi, pi] = a.split('|').map(Number); const w = D2.sheets[wi]; if(w.pages.length < 2) return;
      if(!confirm(`ページ「${w.pages[pi].title}」を消しますか？（中の欄もいっしょに消えます。「元に戻す」で戻せます）`)) return; edSnap(); w.pages.splice(pi, 1); ED.wp = Math.max(0, pi - 1); break; }
    case 'infoadd': edSnap(); D2[a].push({notices:{nenji:[], from:4, to:3, michi:['すべて'], title:'新しいおしらせ', body:'', rel:[]}, soudan:{id:'', name:'新しい相談先', what:'', where:'学内', url:''}, words:{w:'新しいことば', y:'', d:''}}[a]); break;
    case 'xlapply': edApplyXL(); return;
    case 'xlcancel': ED.xl = null; edRender(); return;
    case 'xlexport': edExportStyled(); return;
    case 'xlexportplain': edExportXL(); return;
    case 'xlorigclear': ED.orig = null; edRender(); return;
    case 'pubfiles': ED.who = ($('#edwho') || {}).value ?? ED.who; ED.what = ($('#edwhat') || {}).value ?? ED.what; try{ localStorage.setItem('cs-ed-who', ED.who); }catch(err){} edPublishFiles(a); return;
    case 'jsonout': download(`清明キャリアApps_編集データ_${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify({kind:'careerstep-edit', D:ED.D, base:ED.base}, null, 1), 'application/json'); return;
    case 'discard': if(!confirm('下書きを捨てて、公開版にもどしますか？（元に戻せません）')) return; try{ localStorage.removeItem(EKEY); localStorage.removeItem(EKEY + '-preview'); }catch(err){} ED.D = edDefaults(clone(PUB)); ED.base = PUB.stamp || ''; ED.undo = []; edToast('公開版にもどしました'); edRender(); return;
    case 'pwchange': edPw(); return;
    default: return;
  }
  edSave(); edRender();
}
/* 画面の中の操作を受ける */
(function(){
  const root = document.getElementById('editor');
  root.addEventListener('click', e => { const t = e.target.closest('[data-e]'); if(!t || t.disabled) return; e.preventDefault(); edAct(t.dataset.e, t.dataset.a || '', t); });
  root.addEventListener('focusin', e => { if(e.target.dataset && e.target.dataset.p) ED.pend = JSON.stringify(ED.D); });
  root.addEventListener('input', e => {
    const t = e.target;
    if(t.dataset.eQ){ ED.q = t.value; clearTimeout(ED.qt); ED.qt = setTimeout(() => { edRender(); const s = root.querySelector('[data-e-q]'); if(s){ s.focus(); s.setSelectionRange(s.value.length, s.value.length); } }, 250); return; }
    const p = t.dataset.p; if(!p) return;
    if(ED.pend){ ED.undo.push(ED.pend); if(ED.undo.length > 40) ED.undo.shift(); ED.pend = null; }
    let v = t.value; const ty = t.dataset.ty;
    if(ty === 'num') v = v === '' ? '' : (+v || 0);
    if(ty === 'lines') v = v.split('\n').map(x => x.trim()).filter(Boolean);
    if(ty === 'csv') v = v.split(/[、,／\s]+/).map(x => x.trim()).filter(Boolean);
    if(ty === 'ui'){ if(v.trim()) ED.D.ui[p.slice(3)] = v; else delete ED.D.ui[p.slice(3)]; }
    else pset(ED.D, p, v);
    if(t.type === 'color'){ const tx = root.querySelector(`input.mono[data-p="${CSS.escape(p)}"]`); if(tx) tx.value = v; }
    edSave(); edStatus();
  });
  root.addEventListener('change', e => {
    const t = e.target;
    if(t.id === 'edxl' && t.files[0]) return edImportXL(t.files[0]);
    if(t.id === 'edxlorig' && t.files[0]){ const f = t.files[0]; f.arrayBuffer().then(buf => { ED.orig = {name:f.name, buf}; edRender(); }); return; }
    if(t.id === 'edjson' && t.files[0]){ t.files[0].text().then(s => { try{ const o = JSON.parse(s); if(!o.D || !o.D.contents) throw new Error(); edSnap(); ED.D = edDefaults(o.D); edSave(); edToast('編集データを読み込みました'); edRender(); }catch(err){ edToast('清明キャリアAppsの編集データではないようです'); } }); return; }
    if(t.dataset.ren === 'concern') return renameConcern(t.dataset.old, t.value);
    if(t.dataset.yomi !== undefined){ edSnap(); ED.D.yomi = ED.D.yomi || {}; ED.D.yomi[t.dataset.yomi] = t.value.trim(); edSave(); return; }
    if(t.dataset.eType){ const f = pget(ED.D, t.dataset.eType); edSnap(); const nf = newField(t.value); f.t = t.value; ['ch', 'rows', 'cols'].forEach(k => { if(nf[k] && !(f[k] || []).length) f[k] = nf[k]; }); edSave(); edRender(); return; }
    if(t.dataset.rr || t.tagName === 'SELECT') edRender();
  });
  root.addEventListener('toggle', e => { const d = e.target; if(d.dataset && d.dataset.eOpen !== undefined && d.open) ED.open = +d.dataset.eOpen; }, true);
})();

render();
if(PREVIEW && sessionStorage.getItem('cs-ed-back') === '1'){ sessionStorage.removeItem('cs-ed-back'); openEditorGate(); }
</script>
